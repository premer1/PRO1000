spring.application.name=CRMProject
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:pro1000.railway.internal}:${DB_PORT:5432}/${POSTGRES_DB:crm_project}
spring.datasource.username=${DB_USERNAME:crm_user}
spring.datasource.password=${DB_PASSWORD:crm_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.rest.base-path=/api
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.seed-demo-data=${APP_SEED_DEMO_DATA:true}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4.1-mini}
