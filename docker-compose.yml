services:
  db:
    image: postgres:16-alpine
    container_name: crm-project-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_project}
      POSTGRES_USER: ${DB_USERNAME:-crm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - crm_project_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-crm_user} -d ${POSTGRES_DB:-crm_project}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crm_project_data:
